info:
  name: List products
  type: http
  seq: 1
  tags:
    - Products

http:
  method: GET
  url: "{{baseUrl}}/api/products/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Response for status 200
    request:
      url: "{{baseUrl}}/api/products/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": ""
          }
  - name: 404 Response
    description: Response for status 404
    request:
      url: "{{baseUrl}}/api/products/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": ""
          }
