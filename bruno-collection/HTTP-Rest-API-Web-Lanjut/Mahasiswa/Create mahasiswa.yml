info:
  name: Create mahasiswa
  type: http
  seq: 2
  tags:
    - Mahasiswa

http:
  method: POST
  url: "{{baseUrl}}/api/mahasiswa/"
  body:
    type: json
    data: |-
      {
        "name": "",
        "studentId": "",
        "major": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Response for status 201
    request:
      url: "{{baseUrl}}/api/mahasiswa/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "studentId": "",
            "major": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": ""
          }
  - name: 500 Response
    description: Response for status 500
    request:
      url: "{{baseUrl}}/api/mahasiswa/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "studentId": "",
            "major": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": ""
          }
