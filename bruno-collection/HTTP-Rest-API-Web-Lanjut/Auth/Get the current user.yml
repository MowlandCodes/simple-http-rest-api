info:
  name: Get the current user
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: GET
  url: "{{baseUrl}}/api/auth/profile"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Response for status 200
    request:
      url: "{{baseUrl}}/api/auth/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": {
              "id": 0,
              "name": "",
              "email": "",
              "age": 0
            }
          }
  - name: 401 Response
    description: Response for status 401
    request:
      url: "{{baseUrl}}/api/auth/profile"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": ""
          }
  - name: 500 Response
    description: Response for status 500
    request:
      url: "{{baseUrl}}/api/auth/profile"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "data": ""
          }
